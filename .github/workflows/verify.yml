name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-ci:
    name: verify:ci
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verify:ci
        run: pnpm verify:ci
        timeout-minutes: 30

  verify-migrations:
    name: verify:migrations
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare disposable PostgreSQL image
        run: docker pull postgres:17-alpine

      - name: Run verify:migrations
        run: pnpm verify:migrations
        timeout-minutes: 20

      - name: Run independent canvas DB contracts
        run: pnpm verify:canvas-contracts:db
        timeout-minutes: 8

  verify-e2e:
    name: verify:e2e
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare disposable E2E base images
        run: |
          docker pull postgres:17-alpine
          docker pull node:24.22.1-alpine
          docker pull golang:1.25-alpine
          docker pull alpine:3.22

      - name: Run verify:e2e
        run: pnpm verify:e2e
        timeout-minutes: 50

  publish-images:
    name: Publish verified images
    needs: [verify-ci, verify-migrations, verify-e2e]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == '0401lucky/narra-image'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout verified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1

      - name: Prepare immutable source images
        id: release
        run: node scripts/publish-images.mjs prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_GATE_RESULTS: ${{ toJSON(needs) }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to repository container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish App source image
        id: app
        if: steps.release.outputs.app_build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.release.outputs.app_image }}:${{ steps.release.outputs.source_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/0401lucky/narra-image
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=narra-image-app-amd64
          cache-to: type=gha,mode=max,scope=narra-image-app-amd64

      - name: Build and publish Worker source image
        id: worker
        if: steps.release.outputs.worker_build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.release.outputs.worker_image }}:${{ steps.release.outputs.source_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/0401lucky/narra-image
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=narra-image-worker-amd64
          cache-to: type=gha,mode=max,scope=narra-image-worker-amd64

      - name: Verify public image pair and promote latest
        run: node scripts/publish-images.mjs finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_GATE_RESULTS: ${{ toJSON(needs) }}
          APP_EXPECTED_DIGEST: ${{ steps.app.outputs.digest || steps.release.outputs.app_digest }}
          WORKER_EXPECTED_DIGEST: ${{ steps.worker.outputs.digest || steps.release.outputs.worker_digest }}
