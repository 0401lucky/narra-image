name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-ci:
    name: verify:ci
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verify:ci
        run: pnpm verify:ci
        timeout-minutes: 30

  verify-migrations:
    name: verify:migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare disposable PostgreSQL image
        run: docker pull postgres:17-alpine

      - name: Run verify:migrations
        run: pnpm verify:migrations
        timeout-minutes: 20

  verify-e2e:
    name: verify:e2e
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare disposable PostgreSQL image
        run: docker pull postgres:17-alpine

      - name: Run verify:e2e
        run: pnpm verify:e2e
        timeout-minutes: 50
