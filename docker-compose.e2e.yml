x-runner-labels: &runner-labels
  com.narra.e2e.owner: "${E2E_OWNER_TOKEN:?E2E runner 必须注入 owner token}"

x-runtime-environment: &runtime-environment
  DATABASE_URL: "${E2E_DATABASE_URL:?E2E runner 必须注入完整数据库 URL}"
  AUTH_SECRET: "${E2E_AUTH_SECRET:?E2E runner 必须注入 AUTH_SECRET}"
  APP_URL: https://narra-e2e.invalid
  BUILTIN_PROVIDER_BASE_URL: ""
  BUILTIN_PROVIDER_API_KEY: ""
  BUILTIN_PROVIDER_MODEL: gpt-image-2
  BUILTIN_PROVIDER_CREDIT_COST: "5"
  BUILTIN_PROVIDER_NAME: Studio
  BUILTIN_PROVIDER_VIDEO_MODEL: sora-2
  BUILTIN_PROVIDER_VIDEO_CREDIT_COST: "20"
  ENABLE_LOCAL_IMAGE_FALLBACK: "false"
  WORKER_CONTRACTS_V1_ENABLED: "false"
  CANVAS_ENABLED: "${E2E_CANVAS_ENABLED:-false}"
  CANVAS_ASSET_GC_INTERVAL_SECONDS: "60"
  CANVAS_ASSET_GC_BATCH_SIZE: "20"
  S3_ENDPOINT: "${E2E_S3_ENDPOINT:-}"
  S3_REGION: "${E2E_S3_REGION:-us-east-1}"
  S3_BUCKET: "${E2E_S3_BUCKET:-}"
  S3_ACCESS_KEY_ID: "${E2E_S3_ACCESS_KEY_ID:-}"
  S3_SECRET_ACCESS_KEY: "${E2E_S3_SECRET_ACCESS_KEY:-}"
  S3_PUBLIC_BASE_URL: "${E2E_S3_PUBLIC_BASE_URL:-}"
  AWS_EC2_METADATA_DISABLED: "true"
  GATEWAY_ENABLED: "false"
  GATEWAY_WAIT_TIMEOUT_SECONDS: "900"
  GATEWAY_POLL_INTERVAL_MS: "1000"
  GATEWAY_SIGNATURE_SKEW_SECONDS: "300"
  WORKER_METRICS_TOKEN: "${E2E_METRICS_TOKEN:?E2E runner 必须注入 metrics token}"
  WORKER_SHUTDOWN_HARD_TIMEOUT_SECONDS: "10"
  LOG_LEVEL: info

x-worker-environment: &worker-environment
  <<: *runtime-environment
  CANVAS_ENABLED: "${E2E_WORKER_CANVAS_ENABLED:-false}"
  NODE_ENV: production
  WORKER_RUNTIME_MODE: dedicated
  WORKER_HTTP_ADDR: ":8081"
  WORKER_CONCURRENCY: "1"
  WORKER_METRICS_WINDOW_MINUTES: "60"
  WORKER_POLL_INTERVAL_MS: "250"
  WORKER_JOB_TIMEOUT_SECONDS: "60"
  WORKER_MAX_ATTEMPTS: "2"
  WORKER_MAX_ACTIVE_PER_USER: "1"
  WORKER_RETRY_BASE_DELAY_MS: "100"
  WORKER_SHUTDOWN_GRACE_SECONDS: "2"
  WORKER_VIDEO_POLL_INTERVAL_MS: "250"

services:
  db:
    image: ${E2E_POSTGRES_IMAGE:-postgres:17-alpine}
    pull_policy: never
    restart: "no"
    labels:
      <<: *runner-labels
    environment:
      POSTGRES_DB: "${E2E_POSTGRES_DB:?}"
      POSTGRES_USER: "${E2E_POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${E2E_POSTGRES_PASSWORD:?}"
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 1s
      timeout: 1s
      retries: 30

  object-store:
    image: "${E2E_APP_IMAGE:?}"
    pull_policy: never
    restart: "no"
    stop_grace_period: 5s
    labels:
      <<: *runner-labels
    environment:
      E2E_FIXTURE_CONTAINER: "1"
      E2E_OWNER_TOKEN: "${E2E_OWNER_TOKEN:?}"
      E2E_STORE_BUCKET: "${E2E_STORE_BUCKET:?}"
      E2E_STORE_ACCESS_KEY: "${E2E_STORE_ACCESS_KEY:?}"
      E2E_STORE_TOKEN: "${E2E_STORE_TOKEN:?}"
    command: ["node", "scripts/fixtures/canvas-object-store.mjs"]
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/__e2e/health >/dev/null"]
      interval: 1s
      timeout: 1s
      retries: 15

  migrate:
    image: "${E2E_APP_IMAGE:?}"
    pull_policy: never
    restart: "no"
    labels:
      <<: *runner-labels
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "${E2E_DATABASE_URL:?}"
    command: ["node", "scripts/migrate-deploy.mjs"]

  worker:
    image: "${E2E_WORKER_IMAGE:?}"
    pull_policy: never
    restart: "no"
    stop_grace_period: 15s
    labels:
      <<: *runner-labels
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-store:
        condition: service_healthy
    environment:
      <<: *worker-environment
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/readyz >/dev/null"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 2s

  app:
    image: "${E2E_APP_IMAGE:?}"
    pull_policy: never
    restart: "no"
    stop_grace_period: 10s
    labels:
      <<: *runner-labels
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    environment:
      <<: *runtime-environment
      NODE_ENV: production
      PORT: "3000"
      ENABLE_EMBEDDED_WORKER: "false"
      WORKER_RUNTIME_MODE: dedicated
      WORKER_INTERNAL_URL: http://worker:8081
      WORKER_READINESS_REQUIRED: "${E2E_WORKER_READINESS_REQUIRED:-true}"
      WORKER_READINESS_TIMEOUT_MS: "1000"
      E2E_FIXTURE_APP_HTTP: "1"
      E2E_OWNER_TOKEN: "${E2E_OWNER_TOKEN:?}"
    command: ["node", "node_modules/next/dist/bin/next", "start"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/readyz >/dev/null"]
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 3s

  embedded:
    image: "${E2E_APP_IMAGE:?}"
    pull_policy: never
    profiles: ["embedded"]
    restart: "no"
    stop_grace_period: 15s
    labels:
      <<: *runner-labels
    depends_on:
      db:
        condition: service_healthy
      object-store:
        condition: service_healthy
    environment:
      <<: *runtime-environment
      NODE_ENV: production
      PORT: "3000"
      ENABLE_EMBEDDED_WORKER: "true"
      WORKER_RUNTIME_MODE: embedded
      WORKER_HTTP_ADDR: 127.0.0.1:8081
      WORKER_INTERNAL_URL: http://127.0.0.1:8081
      WORKER_READINESS_REQUIRED: "true"
      WORKER_READINESS_TIMEOUT_MS: "1000"
      WORKER_READY_TIMEOUT_MS: "90000"
      WORKER_READY_POLL_INTERVAL_MS: "250"
      WORKER_SHUTDOWN_GRACE_SECONDS: "2"
      E2E_FIXTURE_APP_HTTP: "1"
      E2E_OWNER_TOKEN: "${E2E_OWNER_TOKEN:?}"
    command: ["node", "scripts/start-prod.mjs"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/readyz >/dev/null"]
      interval: 1s
      timeout: 1s
      retries: 90
      start_period: 3s

  embedded_conflict:
    image: "${E2E_APP_IMAGE:?}"
    pull_policy: never
    profiles: ["conflict"]
    restart: "no"
    stop_grace_period: 15s
    labels:
      <<: *runner-labels
    environment:
      <<: *runtime-environment
      NODE_ENV: production
      PORT: "3000"
      ENABLE_EMBEDDED_WORKER: "true"
      WORKER_RUNTIME_MODE: embedded
      WORKER_HTTP_ADDR: 127.0.0.1:8081
      WORKER_INTERNAL_URL: http://127.0.0.1:8081
      WORKER_READINESS_REQUIRED: "true"
      WORKER_READINESS_TIMEOUT_MS: "1000"
      WORKER_READY_TIMEOUT_MS: "15000"
      WORKER_READY_POLL_INTERVAL_MS: "250"
      WORKER_SHUTDOWN_GRACE_SECONDS: "2"
    command: ["node", "scripts/start-prod.mjs"]

networks:
  default:
    # The runner creates and verifies this owner-labelled, internal-only network.
    # External here prevents Compose from creating/reusing another network.
    external: true
    name: "${E2E_NETWORK_NAME:?E2E runner must create its isolated network}"
